[package]
name = "rtic-stm32g431-led-blink"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]
members = ["common", "peripherals", "boards/esc1_discovery", "boards/resources"]
resolver = "2"

[dependencies]
# Chip variant is STM32G431CB (B-G431B-ESC1 Discovery kit); see
# boards/esc1_discovery for the pin map and boards/resources/Cargo.toml
# for the embassy-stm32 chip feature. Update the probe-rs chip name in
# .cargo/config.toml too if you target a different G431 package/flash size.
esc1_discovery = { path = "boards/esc1_discovery" }
peripherals = { path = "peripherals" }
# `Duration`, for the blink loop's `wait_for` delay in src/main.rs.
common = { path = "common" }

# Firmware-only: `src/main.rs`'s `main()`/`#[entry]` and its defmt logging
# are `cfg(not(test))`-gated so `cargo test --target <host-triple>` (see
# peripherals/README.md) can build and run `Firmware`'s unit tests, which
# don't need any of these.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"

defmt = "1.1.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = 1
