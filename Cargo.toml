[workspace]
members = [
    "common",
    "peripherals",
    "boards/esc1_discovery",
    "boards/resources",
    "macros/rtic_shim",
    "macros/rtic_real",
    "macros/rtic_fake",
    "firmware/benchtest/blinky",
    "firmware/benchtest/adc",
    "firmware/benchtest/cordic",
    "firmware/benchtest/quadrature",
]
# `cargo build`/`cargo run` without `-p` operate on this member only, so the
# existing "just run it" workflow (see README.md) keeps working now that
# firmware/ holds more than one binary. Build/test everything explicitly
# with `--workspace`; run another benchtest with `-p <name>` (e.g. `-p adc`).
default-members = ["firmware/benchtest/blinky"]
resolver = "2"

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = 1
