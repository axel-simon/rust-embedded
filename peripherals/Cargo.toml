[package]
name = "peripherals"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Uptime/Duration/DurationFromTicks — see src/api/clock.rs and
# src/fake/clock.rs, src/stm32g4/clock.rs.
common = { path = "../common" }

# Real STM32G4 GPIO and clock drivers (src/stm32g4/gpio.rs,
# src/stm32g4/clock.rs). Chip variant must match the workspace root's
# stm32g4xx-hal feature (see root Cargo.toml): STM32G431CB (B-G431B-ESC1
# Discovery kit). Target-gated to arm so host-side `cargo test` (see
# README.md) never tries to compile it.
[target.'cfg(target_arch = "arm")'.dependencies]
stm32-metapac = { version = "21", features = ["stm32g431cb"] }
# DWT/DCB core-peripheral access for the cycle-counter-based clock driver.
cortex-m = "0.7.7"
