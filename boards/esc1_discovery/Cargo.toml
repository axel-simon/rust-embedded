[package]
name = "esc1_discovery"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# board.rs lives at the crate root (not src/lib.rs) so the path asked for —
# boards/esc1_discovery/board.rs — is exactly where the module lives.
[lib]
path = "board.rs"

[dependencies]
peripherals = { path = "../../peripherals" }
# Backend-selected Peripherals/Peri aliases + init() — see
# boards/resources/resources.rs. Plain (not target-gated): resources
# handles its own arm/non-arm branching internally.
resources = { path = "../resources" }
# `Duration`, for the `TIM1_DEAD_TIME` board-fact constant below.
common = { path = "../../common" }

# `cortex_m::Peripherals::take()`, passed into `ClockProvider::new()` — see
# `initialize()` below.
[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.7"
