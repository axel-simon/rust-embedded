[package]
name = "resources"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# resources.rs lives at the crate root (not src/lib.rs) so the path asked
# for — boards/resources/resources.rs — is exactly where the module lives.
[lib]
path = "resources.rs"

[dependencies]
# Only needed for enable_gpio_clocks() in init()'s arm branch (see
# resources.rs); the rest of this crate has no other peripherals dependency.
peripherals = { path = "../../peripherals" }

# Real hardware bring-up: embassy_stm32::init() + the Peripherals/Peri
# types resources.rs aliases to on the arm target. Host builds use
# fake_embassy.rs instead, so this is target-gated.
[target.'cfg(target_arch = "arm")'.dependencies]
# No `time-driver-*` feature: that would silently swallow whichever timer
# it names into embassy's own `embassy_time` integration, making it
# unavailable in `Peripherals` — nothing here uses `embassy_time` (this
# workspace's own DWT-cycle-counter-backed `peripherals::stm32g4::clock`
# handles timekeeping instead), so there's no reason to give up a timer for
# it.
embassy-stm32 = { version = "0.6", features = ["stm32g431cb", "rt"] }
# `McuInterface` (see stm32g4.rs).
cortex-m = "0.7.7"
# Registers the RTT logging backend `defmt::info!` (called from
# src/main.rs) dispatches through, and the `#[panic_handler]` — see
# stm32g4.rs. Neither is referenced by name anywhere, so linking them in
# at all requires this crate (which really is used) to import them.
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
